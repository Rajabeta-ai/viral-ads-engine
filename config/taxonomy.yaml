# Occupational / life-situation archetypes for the companionship apps.
archetypes:
  companionship:
    - { id: night_shift_driver,   label: "Night-shift driver (truck/cab/auto)", core_need: "company during 10pm-4am dead hours", states: [Uttar Pradesh, Bihar, Punjab, Maharashtra, Rajasthan] }
    - { id: migrant_tier1,        label: "Tier-1 migrant, family in tier-2/3", core_need: "someone to talk to after work in an empty room", states: [Maharashtra, Karnataka, Delhi, Telangana, Gujarat] }
    - { id: it_professional,      label: "IT / BPO professional, WFH isolation", core_need: "unstructured non-work conversation", states: [Karnataka, Telangana, Maharashtra, Tamil Nadu] }
    - { id: shopkeeper_idle,      label: "Shopkeeper / counter job, long idle hours", core_need: "filling 6 empty hours behind a counter", states: [Gujarat, Rajasthan, Uttar Pradesh, West Bengal] }
    - { id: post_breakup,         label: "Recent breakup, venting nightly", core_need: "non-judgmental listener, no history", states: [Delhi, Punjab, Maharashtra, West Bengal] }
    - { id: social_learner,       label: "Never learned to talk to women", core_need: "low-stakes practice, confidence as a side effect", states: [Bihar, Uttar Pradesh, Madhya Pradesh, Haryana] }
    - { id: bank_govt_desk,       label: "Bank / govt desk job, posting away from home", core_need: "routine evening companionship", states: [Uttar Pradesh, Bihar, Odisha, Madhya Pradesh] }
  cricket:
    - { id: fantasy_player,       label: "Fantasy league player (Dream11/MPL)", core_need: "pre-toss edge, pitch + form data" }
    - { id: stat_nerd,            label: "Stat-arguing superfan", core_need: "ammunition to win group-chat arguments" }
    - { id: casual_score_checker, label: "Score-checker, low engagement", core_need: "fastest score, zero friction" }
    - { id: regional_franchise,   label: "Franchise loyalist (CSK/RCB/MI/KKR)", core_need: "tribal identity content" }
  bhakti:
    - { id: daily_ritual,         label: "Daily aarti / paath householder", core_need: "structured daily practice on phone" }
    - { id: festival_spiker,      label: "Festival-driven observer", core_need: "vrat rules, muhurat, katha on demand" }
    - { id: diaspora_devotee,     label: "Away from home temple", core_need: "darshan + ritual continuity remotely" }
    - { id: anxious_seeker,       label: "Seeking answers in crisis", core_need: "ask a question, get scriptural answer" }
